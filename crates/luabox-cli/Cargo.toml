[package]
name = "luabox-cli"
description = "luabox: the unified Lua toolchain CLI (Frontend context)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# SPEC.md: CLI binary `luabox`; the `lb` alias is created at install time
# by the packaging scripts (hardlink/shim), not as a second cargo target.
[[bin]]
name = "luabox"
path = "src/main.rs"

[dependencies]
luabox-syntax.workspace = true
luabox-diag.workspace = true
luabox-manifest.workspace = true
luabox-types.workspace = true
luabox-lint.workspace = true
luabox-lsp.workspace = true
luabox-lower.workspace = true
luabox-bundle.workspace = true
clap.workspace = true
anyhow.workspace = true
notify.workspace = true
rayon.workspace = true
rowan.workspace = true
tempfile.workspace = true
# `luabox upgrade` verifies the release archive against `SHA256SUMS`
# in-process (see upgrade_cmd.rs).
sha2.workspace = true
# `luabox upgrade` self-replace: renames the running exe out of the way on
# Windows (see upgrade_cmd.rs).
self-replace.workspace = true

[dev-dependencies]
cucumber.workspace = true
tokio.workspace = true
tempfile.workspace = true
# Tests only: they re-parse the JSON artifacts the commands hand-write
# (`luabox doc`'s search index, `--format json` output).
serde_json.workspace = true

[[test]]
name = "acceptance"
harness = false

# The LSP acceptance layer: cucumber scenarios that drive `luabox lsp` as a
# child process and speak JSON-RPC over its stdio, so the editor surface is
# covered black-box like every other command (SPEC.md §8 + §16.2).
[[test]]
name = "lsp_acceptance"
harness = false

[lints]
workspace = true
