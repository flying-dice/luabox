name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Belt-and-braces: the workspace declares [workspace.lints.clippy] with
      # `all`/`pedantic` at warn, but env RUSTFLAGS=-Dwarnings only denies
      # *rustc* warnings — clippy's own lints need `-- -D warnings` to become
      # hard errors, otherwise a pedantic finding passes CI silently.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # tools/differ is deliberately workspace-EXCLUDED (it links real
      # interpreters' behavior, not the product), so nothing above compiles
      # it — a workspace API change can silently rot it until the
      # differential workflow runs on a PR to main (exactly what happened on
      # #45 with the typed-Code u16 seam). Keep it compiling everywhere;
      # Linux is enough, the full harness still runs in differential.yml.
      - run: cargo test --manifest-path tools/differ/Cargo.toml
        if: matrix.os == 'ubuntu-latest'

  # Dual line-coverage gates (cargo-llvm-cov), measured as two ISOLATED
  # suites so each style of testing independently guarantees behaviour:
  #   - unit: every in-process test (libs, bins, per-crate tests/) with the
  #     cucumber e2e binaries excluded. Floor 95 (measured 96.9%).
  #   - e2e: the black-box cucumber suites alone (acceptance +
  #     lsp_acceptance driving the real binary). Floor 83 (measured 85.7%
  #     after the #31 scenario waves; the residue is OS-gated, live-network,
  #     and internal plumbing no black-box flow can force).
  # Raise a floor as its number rises — never lower one to make a PR pass.
  # Each job uploads its lcov as an artifact for inspection.
  coverage-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage-unit
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: >
          cargo llvm-cov --no-report
          -p luabox-bundle -p luabox-db -p luabox-diag -p luabox-hir
          -p luabox-lint -p luabox-lower -p luabox-lsp -p luabox-manifest
          -p luabox-syntax -p luabox-types
      - run: >
          cargo llvm-cov --no-report
          -p luabox-cli --bins --test cross_package_defs --test watch
          --test broken_pipe
      - run: cargo llvm-cov report --fail-under-lines 95
      - run: cargo llvm-cov report --lcov --output-path lcov-unit.info
        if: always()
      # The aggregate floor above can hide a small crate eroding; this
      # enforces the per-crate invariant the docs claim (every crate >= 92
      # unit lines — measured min today: luabox-cli 92.5). See #17.
      - run: python3 scripts/per-crate-coverage.py lcov-unit.info 92
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit-lcov
          path: lcov-unit.info

  coverage-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage-e2e
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: >
          cargo llvm-cov --no-report
          -p luabox-cli --test acceptance --test lsp_acceptance
      - run: cargo llvm-cov report --fail-under-lines 83
      - run: cargo llvm-cov report --lcov --output-path lcov-e2e.info
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-e2e-lcov
          path: lcov-e2e.info

  # SPEC.md §16.1 — perf gates are CI-blocking. scripts/perf-gate.sh is the
  # authoritative list and holds the calibration notes for every budget; it
  # currently runs seven timed legs, all live:
  #   1. cold start                     — `luabox --version`, best of 10
  #   2. `fmt --check` warm             — ~100-kLOC synthetic corpus
  #   3. `check` warm                   — same corpus; the gate §16.1 asks for
  #   4. `lint`, diagnostics-heavy      — 20 k findings in ONE file, suppressed
  #   5. `check`, diagnostics-heavy     — ditto
  #   6. `lint`, findings rendered      — the same corpus, nothing suppressed
  #   7. `check`, findings rendered     — ditto
  # Legs 4-7 exist because the corpus legs 2-3 use is *clean*, so none of
  # them ever times per-diagnostic work — the blind spot that hid an
  # O(diagnostics x file size) line lookup (32 k findings in one file: ~32 s
  # to lint; the same file with one finding: 0.35 s). The suppressed pair
  # times the bookkeeping with the renderer out of the way; the rendered pair
  # times what a user actually pays, renderer included, where a second such
  # cost lived.
  # The LSP keystroke-to-diagnostics budget in §16.1 is NOT gated here — no
  # harness drives the protocol yet; SPEC marks it future work.
  # Every budget is scaled by LUABOX_PERF_FACTOR (set below for this runner).
  perf-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: perf-gates
      # GitHub-hosted runners are ~3x slower and noisier than the dev
      # baseline the budgets were calibrated on (observed: warm check
      # 3145 ms vs the 1000 ms budget). The factor scales every budget;
      # regressions still fail, just against shared-runner reality.
      - run: bash scripts/perf-gate.sh
        env:
          LUABOX_PERF_FACTOR: "4.0"

  # Every example project under examples/ must pass check + fmt --check + lint
  # cleanly against the real binary, plus its per-example extras (build,
  # bundle, .love packaging) and executing the built bundle on lua5.1. See
  # scripts/examples.sh.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: examples
      - run: cargo build --release --bin luabox
      # `unzip` inspects the .love archive. `lua5.1` executes the timemachine
      # bundle the script just built (a 5.4 source lowered to minified 5.1):
      # CI executes the compiler's output to verify it, because a compiler
      # whose emit is never run is only checked against its own opinion of it.
      # The product itself still never runs Lua — the interpreter belongs to
      # this harness, and the script SKIPs the run step when it is absent.
      - name: Install unzip and lua5.1
        run: sudo apt-get update && sudo apt-get install -y unzip lua5.1
      - run: bash scripts/examples.sh
