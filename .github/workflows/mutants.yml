# Mutation testing over luabox-types (#58), on a schedule rather than the
# merge path: a full run costs tens of minutes, and its job is to find
# fixtures that cannot fail — the wave-21 failure mode — not to gate every
# push. Survivors are compared against the committed allowlist
# (scripts/tests/mutants-allowlist.txt): a NEW survivor fails the job, so
# the weekly signal is "a test gap appeared", never a drifting score.
name: mutants

on:
  # `schedule` is only ever evaluated against the workflow file on the
  # repository's DEFAULT branch (main) — GitHub does not run a cron trigger
  # off the branch a PR happens to be open against. This repo lands PRs on
  # develop and promotes to main later, so the cron below stays dormant for
  # the whole develop->main interval: `push: branches: [main]` is the
  # trigger that actually fires, the moment this workflow reaches the one
  # branch schedule can see, instead of waiting up to a week for the next
  # Monday. Once resident on main the cron takes over as the ongoing weekly
  # backstop.
  schedule:
    # Weekly, Monday 04:17 UTC (odd minute to avoid the on-the-hour stampede).
    - cron: "17 4 * * 1"
  push:
    branches: [main]
  workflow_dispatch:
  # Also run gate-selftest (seconds, no cargo-mutants, no build) when the
  # gate itself or its expectations change, so a broken script or a bad
  # allowlist edit cannot land silently and rot until Monday. The full audit
  # deliberately does NOT run on this trigger — see the `mutants` job's
  # `if:` below — a full run costs tens of minutes and `pull_request` fires
  # on every push to an open PR, which is exactly the merge-path cost this
  # workflow rides a schedule to avoid.
  pull_request:
    paths:
      - "scripts/tests/mutants-gate.sh"
      - "scripts/tests/mutants-gate-selftest.sh"
      - "scripts/tests/mutants-allowlist.txt"
      - ".github/workflows/mutants.yml"

jobs:
  # The gate on the gate. Seconds, no cargo-mutants, no build — so it runs
  # first and on every PR that touches the gate, ahead of the two-hour job it
  # guards. Both review rounds found the gate reporting OK for a run that
  # proved nothing; these cases are that class of defect, staged.
  gate-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # The gate shells out to `cargo mutants`, and `cargo` is a rustup shim
      # that resolves rust-toolchain.toml (1.92.0 + rustfmt + clippy) before
      # ever reaching the stubbed cargo-mutants this self-test substitutes —
      # the stub only replaces the subcommand, not the toolchain underneath
      # it. Installing the pinned toolchain once here means that resolution
      # happens up front, not lazily on each of the self-test's ten gate
      # invocations, and a toolchain problem fails as itself instead of
      # surfacing as "cargo-mutants failed with exit 1".
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Self-test the mutation gate's judgement
        run: bash scripts/tests/mutants-gate-selftest.sh

  mutants:
    needs: gate-selftest
    # Not on pull_request: that event fires on every push to an open PR, and
    # a full run costs tens of minutes — the merge-path cost this workflow
    # rides schedule/push-to-main to avoid (see the `on:` block above).
    # gate-selftest above still runs on every PR touching the gate files.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Pinned: mutants-allowlist.txt keys on cargo-mutants' verbatim output
      # (the mutation description text, missed.txt's formatting), so an
      # unpinned `latest` resolving a new release on its own schedule would
      # turn every waived line stale and every survivor new in one stroke,
      # for a reason nothing in this repo names. Bumping the pin is a
      # deliberate change that re-measures the whole allowlist.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0

      # No FILES= here: the scope used to be re-pinned in this job "so it's
      # readable in the job and not only in the script's default" — that
      # readability is exactly what gave the scope two hand-maintained
      # copies, free to drift apart with nothing to notice (F4). The
      # script's default (scripts/tests/mutants-gate.sh) is now the one
      # owner; mutants-gate.sh itself guards against a narrowing that drops
      # a waived file. Widening the audited set is an edit to that default
      # plus a matching allowlist review — not this job.
      - name: Run the mutation gate (merge-seam neighbourhood + infer core)
        run: |
          MUTANTS_OUT="$RUNNER_TEMP/mutants" \
            bash scripts/tests/mutants-gate.sh

      - name: Upload full mutants report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: ${{ runner.temp }}/mutants/mutants.out
          if-no-files-found: ignore
