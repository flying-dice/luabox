[package]
name = "luabox-lint"
description = "luabox: type-informed lint rules over the shared analysis (clippy analog)"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
luabox-syntax.workspace = true
luabox-hir.workspace = true
luabox-diag.workspace = true
# The `[lint]` vocabulary (`LintLevel`, `LintTier`) lives with the manifest
# model; this crate re-exports it and owns the one mapping onto its own
# `Level`/`Tier`, so `luabox-cli` and `luabox-lsp` share it instead of each
# keeping a keyword-string translation (CC-M8). Acyclic: `luabox-manifest`
# depends on nothing in this workspace.
luabox-manifest.workspace = true
rowan.workspace = true

[dev-dependencies]
# Test-only: the rule fixtures resolve the stdlib baseline through
# `luabox_types::stdlib_defs`, exactly as `luabox lint` does. No rule in
# `src/rules` touches the checker, so it stays off the normal build edge.
luabox-types.workspace = true

[lints]
workspace = true
