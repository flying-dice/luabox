# luals parity differential (#57): run lua-language-server over the corpus in
# scripts/tests/luals-differential/ and compare both tools' verdicts against
# the committed expectations. Merge-blocking: no continue-on-error — a parity
# drift in either tool is a diff against a claim and fails the job.
#
# The luals version is PINNED (binary release, sha256-verified): the point of
# the gate is that "matches luals" is measured against a named version, not
# against whatever happened to be latest. Bumping the pin is a deliberate
# change that re-measures every row (see the intentional-divergence rows in
# expected.tsv for what may flip).
name: luals-parity

on:
  push:
    branches: [main]
    paths:
      # luabox-types and luabox-cli, plus every crate either transitively
      # depends on (per their Cargo.toml [dependencies]) that can move a
      # `luabox check` verdict: parsing, lowering, diagnostics, lint, LSP,
      # bundling and manifest resolution all sit upstream of the checker a
      # generic-carrier `require` runs through. Only luabox-db is excluded —
      # nothing on the check path depends on it. A narrower filter lets a
      # lowering or parse change merge with parity unmeasured, surfacing as
      # drift on whatever unrelated luabox-types PR runs next.
      - "crates/luabox-types/**"
      - "crates/luabox-cli/**"
      - "crates/luabox-hir/**"
      - "crates/luabox-syntax/**"
      - "crates/luabox-diag/**"
      - "crates/luabox-manifest/**"
      - "crates/luabox-lint/**"
      - "crates/luabox-lsp/**"
      - "crates/luabox-lower/**"
      - "crates/luabox-bundle/**"
      - "scripts/tests/luals-differential.sh"
      - "scripts/tests/luals-differential/**"
      - ".github/workflows/luals-parity.yml"
  pull_request:
    paths:
      # luabox-types and luabox-cli, plus every crate either transitively
      # depends on (per their Cargo.toml [dependencies]) that can move a
      # `luabox check` verdict: parsing, lowering, diagnostics, lint, LSP,
      # bundling and manifest resolution all sit upstream of the checker a
      # generic-carrier `require` runs through. Only luabox-db is excluded —
      # nothing on the check path depends on it. A narrower filter lets a
      # lowering or parse change merge with parity unmeasured, surfacing as
      # drift on whatever unrelated luabox-types PR runs next.
      - "crates/luabox-types/**"
      - "crates/luabox-cli/**"
      - "crates/luabox-hir/**"
      - "crates/luabox-syntax/**"
      - "crates/luabox-diag/**"
      - "crates/luabox-manifest/**"
      - "crates/luabox-lint/**"
      - "crates/luabox-lsp/**"
      - "crates/luabox-lower/**"
      - "crates/luabox-bundle/**"
      - "scripts/tests/luals-differential.sh"
      - "scripts/tests/luals-differential/**"
      - ".github/workflows/luals-parity.yml"

env:
  LUALS_VERSION: "3.13.5"
  LUALS_SHA256: "5d4316291b8c79b145002318fbb7cc294a327c314e2711e590609b178478eb59"

jobs:
  luals-parity:
    runs-on: ubuntu-latest
    # This job builds luabox in release mode and then runs
    # lua-language-server --check with its output suppressed
    # (scripts/tests/luals-differential.sh) — a hang on either has no other
    # signal, and this is merge-blocking, so it must not eat the 360-minute
    # default before anyone learns anything.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install lua-language-server ${{ env.LUALS_VERSION }} (pinned)
        run: |
          # -f: a missing/renamed release asset (404 body, rc=0 without it)
          # must fail here as a fetch error, not one line later as
          # `sha256sum: FAILED` — which reads identically to "the pinned
          # artifact was tampered with" on a security-shaped check and hides
          # the actual fix (bump the pin). --retry survives a transient CDN
          # blip instead of failing the merge-blocking job the same way.
          curl -sSL -f --retry 3 -o luals.tar.gz \
            "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz"
          echo "${LUALS_SHA256}  luals.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/luals"
          tar xzf luals.tar.gz -C "$HOME/luals"
          "$HOME/luals/bin/lua-language-server" --version

      - name: Build luabox (release)
        run: cargo build --locked --release --bin luabox

      - name: Run the parity differential
        # LUALS_REQUIRED=1: the driver SKIPs (exit 0) when no luals binary is
        # on PATH — a tolerable local convenience for a dev box without the
        # tarball installed, but CI always installs it two steps above, so a
        # SKIP here means the install step silently produced a binary that
        # was not where LUALS pointed (tarball layout change, a dropped
        # LUALS= prefix). Without this, that failure mode is a green job
        # that measured none of the parity it exists to measure (F23).
        run: LUALS="$HOME/luals/bin/lua-language-server" LUALS_REQUIRED=1 scripts/tests/luals-differential.sh
