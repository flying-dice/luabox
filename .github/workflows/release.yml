name: release

# Cut a GitHub Release for a pushed `v*` tag, and do not let it go live until
# the artefacts it ships have been installed and fully exercised on every OS.
#
# The shape of the pipeline is the point:
#
#   create-release      create the release as a TRUE DRAFT (notes lifted from
#                       CHANGELOG.md). A draft has no public download URLs and
#                       is invisible to `luabox upgrade` / the installers, so
#                       nothing a user runs can reach it yet.
#   build               native `luabox` binaries for the three shipped targets.
#   publish             attach binaries + SHA256SUMS + both install scripts.
#   verify (3 OSes)     download the install script FROM THE DRAFT, run it to
#                       install the DRAFT's binary, then run the FULL black-box
#                       acceptance + LSP acceptance suites against that
#                       INSTALLED binary. This is the release gate.
#   publish-release     asset-completeness + checksum re-verification gates,
#                       then the single draft -> published transition:
#                       `gh release edit --draft=false --latest`.
#   post-publish-smoke  the handful of things that can only work once the
#                       release is public: `curl … | bash` / `irm … | iex` off
#                       the public URLs, and `luabox upgrade <tag>`.
#
# Everything happens in this ONE workflow run, triggered by the tag push — not
# via an `on: release` trigger. A release created here with GITHUB_TOKEN would
# NOT fire a downstream `release: published` workflow (GitHub suppresses
# token-raised events), so the whole pipeline is chained by `needs:` instead.
#
# Installing from a draft needs credentials that ordinary users do not have.
# `scripts/install.{sh,ps1}` grew exactly one extra path for this: under an
# explicit LUABOX_DRAFT_INSTALL=1 opt-in (which requires GITHUB_TOKEN and a
# pinned LUABOX_VERSION), they resolve the release through the authenticated
# GitHub API (drafts only appear in the *list* endpoint — `releases/tags/<tag>`
# 404s for a draft) and pull each asset by id. Without the opt-in the scripts
# behave exactly as they always have — ambient CI tokens never change install
# behaviour — which is what `post-publish-smoke` proves against the real
# public URLs.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Never run two release pipelines for the same tag concurrently; do not cancel
# an in-flight one (a half-published release is worse than a slow one).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Create the release up front so the build/publish/verify jobs have a target
  # to attach to and read from — but as a DRAFT (`--draft=true`). A draft is
  # not resolvable by `/releases/latest`, has no public asset URLs, and is not
  # visible to anyone without repo read access, so a release that fails
  # verification never existed as far as users are concerned. The one and only
  # place it stops being a draft is the final step of `publish-release`.
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          # Print the `## [x.y.z] - DATE` block (Keep a Changelog format — see
          # CHANGELOG.md / RELEASING.md) up to the next `## [` header.
          awk -v ver="$version" '
            BEGIN { found = 0 }
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "(no CHANGELOG.md entry found for ${version})" > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md
      # Idempotent on purpose: RELEASING.md tells a maintainer that a red run
      # can be fixed by re-running the workflow, and a bare `gh release create`
      # 422s the moment the draft from the failed run still exists. So:
      #   - no release for this tag  -> create it as a draft;
      #   - a DRAFT release exists   -> reuse it (publish-release uploads with
      #                                 `--clobber`, so re-runs overwrite
      #                                 assets cleanly);
      #   - a PUBLISHED release      -> fail loudly. Re-running over a live
      #                                 release would silently replace what
      #                                 users already downloaded; that needs a
      #                                 human, a new tag, or an explicit yank.
      - name: Create the GitHub Release as a draft (or reuse an existing draft)
        run: |
          set -euo pipefail
          existing=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          case "$existing" in
            true)
              echo "::notice::a draft release for ${TAG} already exists — reusing it (re-run path)"
              gh release edit "$TAG" \
                --title "luabox $TAG" \
                --notes-file release-notes.md \
                --draft=true \
                --latest=false
              ;;
            false)
              echo "::error::${TAG} is already PUBLISHED — refusing to republish over a live release." >&2
              echo "Cut a new tag, or delete/yank the published release deliberately first." >&2
              exit 1
              ;;
            *)
              gh release create "$TAG" \
                --title "luabox $TAG" \
                --notes-file release-notes.md \
                --draft=true \
                --latest=false
              ;;
          esac

  # Build native release binaries for the tagged commit. Runner arch is
  # load-bearing: macos-latest is Apple Silicon (aarch64-apple-darwin). Intel
  # macOS (x86_64-apple-darwin) is not shipped — keep it out of the installer too.
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest   # Apple Silicon only
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v4
      # Match rust-toolchain.toml (1.92.0) and the repo's other workflows.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # `--locked`: build from the committed Cargo.lock exactly, so a release
      # binary is bit-reproducible against the tagged tree and never silently
      # picks up a newer transitive dep.
      - name: Build
        run: cargo build --release --locked -p luabox-cli --target ${{ matrix.target }}
      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist
          tar -czf "dist/luabox-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" luabox
      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/luabox.exe" -DestinationPath "dist/luabox-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: luabox-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # The VS Code extension lives in its own repo (flying-dice/luabox-vscode)
  # and ships its .vsix from that repo's releases — no vsix job here.

  # Checksum the binaries and attach them, SHA256SUMS, and the install scripts
  # to the DRAFT release. `gh release upload` works fine against a draft. The
  # install scripts are attached as assets (not just left in-tree) because
  # `verify` downloads them back out of the release: the script that is tested
  # must be the artefact users will actually fetch.
  publish:
    name: Upload assets
    needs: [create-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum luabox-*.tar.gz luabox-*.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Upload assets to the draft release
        run: |
          gh release upload "$TAG" \
            dist/luabox-*.tar.gz dist/luabox-*.zip dist/SHA256SUMS \
            scripts/install.sh scripts/install.ps1 \
            --clobber

  # THE release gate. On each of the three shipped OSes:
  #
  #   1. pull `install.sh`/`install.ps1` out of the DRAFT release (so the asset
  #      is what gets exercised, not the checked-out copy),
  #   2. run it with LUABOX_DRAFT_INSTALL=1 + GITHUB_TOKEN +
  #      LUABOX_VERSION=<tag> — the draft-aware path — and assert the
  #      installed binary reports the tag's version,
  #   3. run the FULL black-box e2e suites (`acceptance` + `lsp_acceptance`,
  #      the cucumber executable spec, SPEC.md §16.2) with LUABOX_E2E_BIN
  #      pointed at that INSTALLED executable. Every scenario spawns the
  #      installed binary as a child process, so what is under test is the
  #      artefact users will download — not a cargo-built one.
  #
  # Plus the two probes the e2e suite structurally cannot cover, because they
  # are about the *installer*, not the binary: installing into a directory
  # whose path CONTAINS A SPACE (quoting bugs), and the negative case where a
  # pinned nonexistent version must fail non-zero rather than silently pass.
  #
  # What is deliberately NOT here: `luabox upgrade` (it resolves published
  # releases, so it cannot work against a draft — it moved to
  # `post-publish-smoke`), and the old hand-rolled `check`/`fmt`/`lint`/`doc`/
  # LSP-handshake probes, which the e2e suites cover far more thoroughly.
  #
  # The suites run without any live-network opt-in: nothing in
  # `crates/luabox-cli/tests/features/` is tagged for network access, so the
  # gate is fully deterministic and offline apart from the install itself.
  verify:
    name: Verify ${{ matrix.os }}
    needs: publish
    runs-on: ${{ matrix.os }}
    permissions:
      # `contents: write`, reluctantly: the REST API only lists DRAFT releases
      # for callers with push access, so a `contents: read` token cannot see
      # the draft at all — neither `gh release download` nor the install
      # scripts' API path would find it. This job never writes anything; the
      # only mutation in the whole pipeline is `publish-release`'s final edit.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: macos-latest
            shell: bash
          - os: windows-latest
            shell: pwsh
    env:
      # GH_TOKEN drives `gh release download`; GITHUB_TOKEN authenticates the
      # install scripts' draft-aware API path, and LUABOX_DRAFT_INSTALL=1 is
      # the explicit opt-in that switches them onto it (token presence alone
      # never does — ambient CI tokens must not change install behaviour).
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LUABOX_DRAFT_INSTALL: "1"
      TAG: ${{ github.ref_name }}
      # Match ci.yml: a warning in the test harness is a build failure.
      RUSTFLAGS: -Dwarnings
    steps:
      # The tagged source is needed for the cucumber feature files and step
      # definitions — the harness is the checked-out spec, the binary under
      # test is the installed release artefact.
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-verify-${{ matrix.os }}

      # ── Install from the draft (unix) ────────────────────────────────────
      - name: Install from the draft release (unix)
        if: matrix.shell == 'bash'
        shell: bash
        run: |
          set -euo pipefail

          # Fetch the install script AS A RELEASE ASSET. `gh release download`
          # resolves drafts with a token (it falls back to the list endpoint
          # when `releases/tags/<tag>` 404s), which the public URL cannot.
          work="$(mktemp -d)"
          gh release download "$TAG" --pattern 'install.sh' --dir "$work"

          # LUABOX_DRAFT_INSTALL=1 + GITHUB_TOKEN (both job env) put install.sh
          # on its draft-aware path; LUABOX_VERSION pins the tag.
          LUABOX_VERSION="$TAG" bash "$work/install.sh"

          # install.sh installs to $HOME/.luabox/bin by default.
          export PATH="$HOME/.luabox/bin:$PATH"

          # Version must match the tag (strip leading 'v': v0.1.0 -> "0.1.0").
          ver_out="$(luabox --version)"
          echo "version: $ver_out"
          expected="${TAG#v}"
          if ! printf '%s' "$ver_out" | grep -qE "(^| )${expected}( |$)"; then
            echo "error: 'luabox --version' = '$ver_out', expected to contain '$expected'" >&2
            exit 1
          fi

          # Hand the installed executable to the e2e step below.
          echo "LUABOX_E2E_BIN=$HOME/.luabox/bin/luabox" >> "$GITHUB_ENV"
          echo "LUABOX_INSTALL_SH=$work/install.sh" >> "$GITHUB_ENV"

      # ── Install from the draft (windows) ─────────────────────────────────
      - name: Install from the draft release (windows)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $ProgressPreference = "SilentlyContinue"

          $tag = $env:TAG

          # Fetch install.ps1 AS A RELEASE ASSET (draft-aware via gh + token).
          $work = Join-Path $env:RUNNER_TEMP "release-assets"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          gh release download $tag --pattern 'install.ps1' --dir $work
          if ($LASTEXITCODE -ne 0) { Write-Error "could not download install.ps1 from the draft release"; exit 1 }
          $ps1 = Join-Path $work "install.ps1"

          # Run it file-based first, so a script parse error surfaces clearly.
          # install.ps1 is a PowerShell script (not an external exe), so
          # $LASTEXITCODE is unreliable after `& $ps1`; rely on
          # $ErrorActionPreference=Stop for throws and assert the exe landed.
          # LUABOX_DRAFT_INSTALL=1 + GITHUB_TOKEN (both job env) put it on the
          # draft-aware path.
          $env:LUABOX_VERSION = $tag
          & $ps1

          $exe = Join-Path (Join-Path $env:USERPROFILE ".luabox\bin") "luabox.exe"
          if (-not (Test-Path $exe)) { Write-Error "install.ps1 did not produce $exe"; exit 1 }

          # Version must match the tag (strip leading 'v').
          $verOut = (& $exe --version)
          Write-Host "version: $verOut"
          $expected = $tag.TrimStart('v')
          if ($verOut -notmatch "(^|\s)$([regex]::Escape($expected))(\s|`$)") {
            Write-Error "'luabox --version' = '$verOut', expected to contain '$expected'"
            exit 1
          }

          # Hand the installed executable (and the script asset) to the steps
          # below. Add-Content, not Out-File: no BOM to corrupt GITHUB_ENV.
          Add-Content -Path $env:GITHUB_ENV -Value "LUABOX_E2E_BIN=$exe"
          Add-Content -Path $env:GITHUB_ENV -Value "LUABOX_INSTALL_PS1=$ps1"

      # ── The gate itself ──────────────────────────────────────────────────
      # The whole executable spec, black-box, against the installed artefact.
      # LUABOX_E2E_BIN comes from the install step above; without it the suites
      # would silently fall back to a cargo-built binary and prove nothing
      # about the release. `--locked` for the same reason `build` uses it.
      # `bash` on all three runners (git-bash on Windows) keeps this one step.
      - name: Full e2e suite against the INSTALLED binary
        shell: bash
        run: |
          set -euo pipefail
          test -n "${LUABOX_E2E_BIN:-}" || { echo "error: LUABOX_E2E_BIN unset — the install step did not run" >&2; exit 1; }
          echo "e2e binary under test: $LUABOX_E2E_BIN"
          cargo test --locked -p luabox-cli --test acceptance --test lsp_acceptance

      # ── Installer-only probes (unix) ─────────────────────────────────────
      - name: Installer probes (unix)
        if: matrix.shell == 'bash'
        shell: bash
        run: |
          set -euo pipefail

          # ── Install-dir-with-spaces leg ────────────────────────────────
          # Failure mode: an unquoted $INSTALL_DIR / mkdir / mv in install.sh
          # word-splits on a space and drops the binary in the wrong place (or
          # fails). Nothing in the e2e suite touches the installer, so this
          # stays hand-written. Re-install into a path with a space and assert
          # the exe landed and runs from there.
          spaced_dir="$(mktemp -d)/luabox verify dir"
          LUABOX_INSTALL_DIR="$spaced_dir" LUABOX_VERSION="$TAG" bash "$LUABOX_INSTALL_SH"
          if [ ! -x "$spaced_dir/luabox" ]; then
            echo "error: install.sh did not place an executable in a spaced dir" >&2
            exit 1
          fi
          "$spaced_dir/luabox" --version

          # ── Negative install probe ─────────────────────────────────────
          # Failure mode: install.sh silently exiting 0 when the pinned release
          # does not exist would ship a broken install path. With the draft
          # opt-in in env this also exercises the API lookup's not-found branch.
          # Run under `if` so set -e does not abort on the expected failure.
          if LUABOX_VERSION="v0.0.0-does-not-exist" bash "$LUABOX_INSTALL_SH"; then
            echo "error: install.sh succeeded for a nonexistent version" >&2
            exit 1
          fi
          echo "negative install probe: install.sh correctly failed"

      # ── Installer-only probes (windows) ──────────────────────────────────
      - name: Installer probes (windows)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $ProgressPreference = "SilentlyContinue"

          $tag = $env:TAG
          $ps1 = $env:LUABOX_INSTALL_PS1

          # ── REPL-mode (5.1) spaced-dir install ─────────────────────────
          # Run the installer the way users invoke it: piped into an
          # interactive Windows PowerShell 5.1 session. REPL mode loads
          # PSReadLine, whose 2.0 DLL embeds a stub of
          # System.Runtime.InteropServices.RuntimeInformation that shadows the
          # real type — an arch-detection failure class the file-based run in
          # the install step cannot catch, and one nothing else in this
          # pipeline covers. This pass ALSO installs into a path CONTAINING A
          # SPACE (highest-risk on Windows): an unquoted $InstallDir /
          # Join-Path would drop the exe or fail here, not in prod.
          # LUABOX_DRAFT_INSTALL=1 and GITHUB_TOKEN are inherited by the child
          # process, so the draft-aware path is what runs.
          $spacedDir = Join-Path $env:RUNNER_TEMP "luabox verify dir"
          "`$env:LUABOX_INSTALL_DIR = '$spacedDir'; `$env:LUABOX_VERSION = '$tag'; Get-Content -Raw '$ps1' | iex" | powershell.exe -NoProfile -
          if ($LASTEXITCODE -ne 0) { Write-Error "REPL-mode (5.1) spaced-dir install failed"; exit 1 }
          $spacedExe = Join-Path $spacedDir "luabox.exe"
          if (-not (Test-Path $spacedExe)) { Write-Error "install.ps1 did not produce $spacedExe (spaced dir)"; exit 1 }
          & $spacedExe --version   # exe must launch from a path with a space
          if ($LASTEXITCODE -ne 0) { Write-Error "luabox.exe failed to run from a spaced dir"; exit 1 }

          # ── Negative install probe ─────────────────────────────────────
          # Failure mode: install.ps1 silently exiting 0 when the pinned
          # release does not exist would ship a broken install path. With the
          # draft opt-in in env this also exercises the API lookup's
          # not-found branch. Run in a CHILD process so its `exit 1` yields a
          # clean $LASTEXITCODE and the expected failure does not trip
          # $ErrorActionPreference=Stop in this step.
          "`$env:LUABOX_VERSION = 'v0.0.0-does-not-exist'; & '$ps1'" | powershell.exe -NoProfile -
          if ($LASTEXITCODE -eq 0) { Write-Error "install.ps1 succeeded for a nonexistent version"; exit 1 }
          Write-Host "negative install probe: install.ps1 correctly failed with exit $LASTEXITCODE"

  # Go-live. Only reachable if all three `verify` legs passed, i.e. the
  # release's own artefacts installed cleanly and passed the entire executable
  # spec on Linux, macOS and Windows. Two last gates run here, then the single
  # draft -> published transition. A failure anywhere above skips this job
  # entirely: the release stays a draft, invisible to users, and the pipeline
  # is red.
  publish-release:
    name: Publish release (draft -> current)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # No checkout in this job, so tell gh which repo to act on.
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      # Gate 1 — asset-completeness. Fetch the release's ACTUAL asset list and
      # assert exactly the expected set is present. Failure mode: `build` uses
      # fail-fast:false, so a single silently-skipped OS build can leave the
      # pipeline green while an asset is missing — users on that OS then get a
      # 404 from the installer. This catches it before the release is public.
      #
      # Note the lookup: `releases/tags/<tag>` does NOT resolve a draft even
      # with a token, so the release id comes from the list endpoint first.
      - name: Assert the draft has the complete asset set
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/${GH_REPO}/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"${TAG}\")][0].id // empty")"
          if [ -z "$release_id" ]; then
            echo "error: no release found for tag ${TAG}" >&2
            exit 1
          fi
          names="$(gh api "repos/${GH_REPO}/releases/${release_id}/assets?per_page=100" \
            --jq '.[].name' | sort)"
          echo "assets present:"; printf '%s\n' "$names"
          missing=0
          # 3 binaries + SHA256SUMS + both install scripts, by exact name.
          for want in \
            luabox-x86_64-unknown-linux-gnu.tar.gz \
            luabox-aarch64-apple-darwin.tar.gz \
            luabox-x86_64-pc-windows-msvc.zip \
            SHA256SUMS install.sh install.ps1; do
            if ! printf '%s\n' "$names" | grep -qxF "$want"; then
              echo "error: missing required asset: $want" >&2
              missing=1
            fi
          done
          # And no stray extras: the exact set is the 6 fixed names. (The VS
          # Code extension lives in flying-dice/luabox-vscode and ships its
          # .vsix from that repo's own releases.)
          total="$(printf '%s\n' "$names" | grep -c . || true)"
          if [ "$total" -ne 6 ]; then
            echo "error: expected exactly 6 assets, found $total" >&2
            missing=1
          fi
          [ "$missing" -eq 0 ] || { echo "asset-completeness gate failed" >&2; exit 1; }

      # Gate 2 — independent integrity re-verification. Freshly download every
      # binary + SHA256SUMS straight from the release and run `sha256sum -c`.
      # Failure mode: a truncated/corrupted upload, or a SHA256SUMS computed
      # from different bytes than were actually attached, would pass the
      # per-job upload but hand users a checksum that does not match the file
      # they download. This proves attached sums == attached bytes,
      # independent of the upload path. `gh release download` resolves the
      # draft with the workflow token (the public URLs do not exist yet).
      - name: Re-verify checksums against freshly downloaded draft assets
        run: |
          set -euo pipefail
          work="$(mktemp -d)"; cd "$work"
          gh release download "$TAG" \
            --pattern 'luabox-*.tar.gz' \
            --pattern 'luabox-*.zip' \
            --pattern 'SHA256SUMS'
          echo "--- SHA256SUMS ---"; cat SHA256SUMS
          # -c exits non-zero if any listed file is missing or its hash differs.
          sha256sum -c SHA256SUMS

      # The single draft -> current transition the whole pipeline exists to
      # gate. After this the public release-download URLs resolve, the
      # installers' `latest` lookup finds this tag, and `luabox upgrade` can
      # see it.
      - name: Publish (draft -> current, and mark latest)
        run: gh release edit "$TAG" --draft=false --latest

  # Everything that can only be exercised once the release is actually public:
  # the no-token install one-liners against the real public URLs — both the
  # raw.githubusercontent one the README prints and the release-download copy
  # — and the binary's own self-replace, which resolves published releases
  # through the GitHub API and therefore cannot see a draft.
  #
  # Honest about what this is: the release is ALREADY LIVE when this runs. A
  # failure here does not roll anything back — it turns the pipeline red so a
  # human can act (yank the release, or cut a fix tag). The pre-publish gate is
  # `verify`; this is the post-publish canary for the public-URL surface only.
  post-publish-smoke:
    name: Post-publish smoke ${{ matrix.os }}
    needs: publish-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: macos-latest
            shell: bash
          - os: windows-latest
            shell: pwsh
    steps:
      # No token anywhere in these steps, deliberately: both the
      # raw.githubusercontent and the release-download URLs are public, and
      # the installers must work with nothing in the environment but
      # LUABOX_VERSION.
      - name: Public-path install and upgrade (unix)
        if: matrix.shell == 'bash'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Two sources for the same script, both installed from:
          #
          #   1. raw.githubusercontent — the URL the README's one-liner
          #      literally tells users to curl. It serves the tip of `main`,
          #      which at release time is the commit this tag was cut from,
          #      so this is what a reader of the README actually gets today.
          #      Mandatory: it is the documented path.
          #   2. the release asset attached to this tag — the immutable copy
          #      the release ships. Cheap to also exercise, and any drift
          #      between the two surfaces here rather than in a user's shell.
          #
          # Both pinned to this tag via LUABOX_VERSION.
          readme_url="https://raw.githubusercontent.com/${REPO}/main/scripts/install.sh"
          asset_url="https://github.com/${REPO}/releases/download/${TAG}/install.sh"
          export PATH="$HOME/.luabox/bin:$PATH"

          for url in "$readme_url" "$asset_url"; do
            echo "--- installing from ${url}"
            rm -rf "$HOME/.luabox"
            curl -fsSL "$url" | LUABOX_VERSION="${TAG}" bash
            test -x "$HOME/.luabox/bin/luabox" \
              || { echo "error: ${url} did not produce ~/.luabox/bin/luabox" >&2; exit 1; }
            luabox --version
          done

          # Self-replace: re-install the same tag via the binary's own upgrade
          # command (it resolves published releases, so it could not run before
          # the draft went live), then prove it still runs.
          luabox upgrade "${TAG}"
          luabox --version

          # Failure mode: a self-update that silently "succeeds" on a
          # nonexistent target would leave users convinced they upgraded when
          # they did not. Run under `if` so set -e tolerates the expected
          # failure.
          if luabox upgrade "v0.0.0-does-not-exist"; then
            echo "error: 'luabox upgrade' succeeded for a nonexistent version" >&2
            exit 1
          fi
          echo "negative upgrade probe: correctly failed"

      - name: Public-path install and upgrade (windows)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $ProgressPreference = "SilentlyContinue"

          $tag  = $env:TAG
          $repo = $env:REPO

          # The literal `irm | iex` one-liner from the README, pinned to this
          # tag, in a Windows PowerShell 5.1 REPL — the environment real users
          # are in (and where PSReadLine's RuntimeInformation stub bites).
          #
          # Two sources, same script. raw.githubusercontent is the URL the
          # README hands users; it serves the tip of `main`, which at release
          # time is the commit this tag was cut from — the mandatory one,
          # because it is the documented path. The release asset attached to
          # this tag is the immutable copy, exercised too so drift between
          # them surfaces here and not in a user's shell.
          $binDir = Join-Path $env:USERPROFILE ".luabox\bin"
          $exe = Join-Path $binDir "luabox.exe"
          $urls = @(
            "https://raw.githubusercontent.com/$repo/main/scripts/install.ps1",
            "https://github.com/$repo/releases/download/$tag/install.ps1"
          )
          foreach ($url in $urls) {
            Write-Host "--- installing from $url"
            if (Test-Path (Join-Path $env:USERPROFILE ".luabox")) {
              Remove-Item -Recurse -Force (Join-Path $env:USERPROFILE ".luabox")
            }
            "`$env:LUABOX_VERSION = '$tag'; irm '$url' | iex" | powershell.exe -NoProfile -
            if ($LASTEXITCODE -ne 0) { Write-Error "public-path irm|iex install failed for $url"; exit 1 }
            if (-not (Test-Path $exe)) { Write-Error "$url did not produce $exe"; exit 1 }
          }

          $env:PATH = "$binDir;$env:PATH"
          luabox --version
          if ($LASTEXITCODE -ne 0) { Write-Error "luabox --version failed"; exit 1 }

          # Self-replace on Windows (the rename-aside path): only possible now
          # that the release is published.
          luabox upgrade $tag
          if ($LASTEXITCODE -ne 0) { Write-Error "luabox upgrade failed"; exit 1 }
          luabox --version
          if ($LASTEXITCODE -ne 0) { Write-Error "luabox --version failed post-upgrade"; exit 1 }

          # Failure mode: a self-update that silently "succeeds" on a
          # nonexistent target convinces users they upgraded when they did not.
          # Tolerate BOTH a non-zero exit and a thrown terminating error (pwsh
          # 7.4 can turn a native command's stderr + non-zero exit into a throw
          # under $ErrorActionPreference=Stop).
          $upFailed = $false
          try {
            luabox upgrade "v0.0.0-does-not-exist" 2>&1 | Out-String | Write-Host
            if ($LASTEXITCODE -ne 0) { $upFailed = $true }
          } catch { $upFailed = $true }
          if (-not $upFailed) { Write-Error "'luabox upgrade' succeeded for a nonexistent version"; exit 1 }
          Write-Host "negative upgrade probe: correctly failed"
