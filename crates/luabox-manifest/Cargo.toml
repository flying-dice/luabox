[package]
name = "luabox-manifest"
description = "luabox: luabox.toml manifest model, validation and project layout (Distribution context)"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
toml_edit.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The schema renderer and corpus suite (`src/schema.rs`). `serde`/`serde_json`
# write the generated `schema/luabox.schema.json` — with object keys in the
# order a reader wants them, which is why the renderer serializes its own
# ordered tree rather than a `serde_json::Value` — and read the TOML→JSON
# projection of every corpus manifest; `jsonschema` compiles the schema and
# validates that corpus against it. All test-only: the binary prints the
# generated file with `include_str!` and never renders at runtime.
serde.workspace = true
serde_json.workspace = true
jsonschema.workspace = true

[lints]
workspace = true
