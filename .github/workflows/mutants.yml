# Mutation testing over luabox-types (#58). The FULL audit (the `mutants`
# job below) rides a schedule rather than the merge path: a full run costs
# tens of minutes, and its job is to find fixtures that cannot fail — the
# wave-21 failure mode — not to gate every push. Survivors are compared
# against the committed allowlist (scripts/tests/mutants-allowlist.txt): a
# NEW survivor fails the job, so the weekly signal is "a test gap appeared",
# never a drifting score.
#
# What this means for a PR: `pull_request` cannot trigger the FULL `mutants`
# job (see its `if:` below) — automatically, nothing in CI re-measures the
# WHOLE scope against a PR head before merge, so a claim like
# mutants-allowlist.txt's header ("MEASURED AGAINST THIS HEAD") is evidence
# from a run someone did, not evidence CI enforced for the full scope.
#
# `pull_request` DOES trigger `mutants-pr` below, which is not advisory: it
# is `cargo mutants --in-diff` bounded to the hunks the PR actually touched,
# still checked against the same committed allowlist, and it fails (blocks)
# on any NEW unwaived survivor or NEW timeout inside that diff — the thing a
# PR author can actually be asked to fix. What it does NOT do is re-verify
# the REST of the allowlist (the mutants a PR's diff never touches) — that
# re-verification is what the schedule/push-to-main triggers are for, and
# what `workflow_dispatch` gets on demand for an exact head: Actions ->
# mutants -> Run workflow -> pick the PR's branch as the ref.
# `workflow_dispatch` is not `pull_request`, so the FULL job's `if:` lets it
# through, and `gate-selftest` runs first exactly as it does on every other
# trigger. That is the honest shape of the tradeoff this file makes: a
# bounded, blocking measurement of what changed on every push to an open PR,
# and a full re-measurement of everything else on a schedule, on push to
# main, or on demand — never a full re-measurement automatic-and-free on
# every push (decisions/12-gates-are-self-tested-and-fail-when-they-measure-nothing.md).
name: mutants

on:
  # `schedule` is only ever evaluated against the workflow file on the
  # repository's DEFAULT branch (main) — GitHub does not run a cron trigger
  # off the branch a PR happens to be open against. This repo lands PRs on
  # develop and promotes to main later, so the cron below stays dormant for
  # the whole develop->main interval: `push: branches: [main]` is the
  # trigger that actually fires, the moment this workflow reaches the one
  # branch schedule can see, instead of waiting up to a week for the next
  # Monday. Once resident on main the cron takes over as the ongoing weekly
  # backstop.
  schedule:
    # Weekly, Monday 04:17 UTC (odd minute to avoid the on-the-hour stampede).
    - cron: "17 4 * * 1"
  push:
    branches: [main]
    paths: &mutants_scope_paths
      # Without this, EVERY push to main — including a docs-only promotion —
      # starts the 120-minute `mutants` job below for no reason a mutation
      # score could ever move on. `crates/**` covers any source or test
      # change anywhere in the workspace that could add or remove coverage
      # over the scoped files (mutants-gate.sh's FILES default:
      # crates/luabox-types/src/{env,defs,generics,infer/reify}.rs) — the
      # test that kills a given mutant is not necessarily in the same crate
      # as the mutated code, so this is deliberately the whole `crates/`
      # tree rather than just luabox-types. It is also what `mutants-pr`
      # below needs: gate-selftest hard-depends on
      # crates/luabox-types/src/{env,defs}.rs existing at the paths its
      # fixture scope hardcodes (mutants-gate-selftest.sh's $scope and its
      # defs.rs FILES_OVERRIDE case), and `mutants-pr` needs the files its
      # own `--in-diff` diffs against to exist at all — mutants-gate.sh's
      # own "scoped file does not exist" check is exactly what fires when
      # they do not. Reproduced: rename env.rs on a branch and re-run the
      # self-test locally — most of the suite goes red at once (no case
      # count here on purpose: two revisions of this comment each pinned a
      # number that was stale on arrival — "22 failed / 26-case suite",
      # then "27 failed / 31-case suite" against what is now a 41-case
      # suite. The self-test prints its own counts; trust its output, not
      # this prose — #58 review round 6, M24, twice).
      # `scripts/tests/mutants-*`
      # covers the gate script, its self-test and the committed allowlist as
      # one rule. The workflow file is self-referential for the same reason
      # luals-parity.yml lists itself. Cargo.lock, the workspace Cargo.toml
      # and rust-toolchain.toml are here for the same reason
      # luals-parity.yml's push trigger lists them: `cargo mutants` shells
      # out through `cargo`, a rustup shim that resolves rust-toolchain.toml,
      # and builds against whatever Cargo.lock/Cargo.toml pin — a dependency
      # or toolchain bump can change which mutants are even generated (a
      # changed dependency's types reshape what compiles) exactly like a
      # source change would, and needs the same trigger.
      #
      # This is a YAML anchor (`&mutants_scope_paths`), aliased by
      # `pull_request.paths` below (`*mutants_scope_paths`) rather than
      # copied: `push` used to have 6 entries and `pull_request` 3, the
      # comment on the `pull_request` copy claimed "same glob... for the
      # same reason", and `Cargo.toml`/`Cargo.lock`/`rust-toolchain.toml`
      # were missing from the `pull_request` copy — one rule, two
      # hand-maintained mechanisms, free to disagree (#58 review round 6,
      # M23). One list now backs both triggers by construction; a third
      # trigger needing the same scope (see `mutants-pr`'s own `paths:`
      # below) aliases it too.
      - "crates/**"
      - "scripts/tests/mutants-*"
      - ".github/workflows/mutants.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  # The only trigger under which the FULL `mutants` job (not just
  # `gate-selftest`/`mutants-pr`) can run against an open PR's head — see
  # the file header above. Pick the PR's source branch as the ref when
  # dispatching; `actions/checkout@v4` below checks out whatever ref this
  # run was dispatched against, same as any other trigger.
  workflow_dispatch:
  # Also runs gate-selftest (seconds, no cargo-mutants, no build) and
  # mutants-pr (a bounded, blocking cargo-mutants run over just the PR's
  # diff — see the file header above and that job's own comment) on every
  # push to an open PR touching this scope, so a broken script, a bad
  # allowlist edit, or a genuinely new surviving mutant in the changed code
  # cannot land silently. The FULL audit deliberately does NOT run on this
  # trigger — see the `mutants` job's `if:` below — a full run costs tens of
  # minutes and `pull_request` fires on every push to an open PR, which is
  # exactly the merge-path cost that job rides a schedule to avoid.
  pull_request:
    paths: *mutants_scope_paths

jobs:
  # The gate on the gate. Seconds, no cargo-mutants, no build — so it runs
  # first and on every PR that touches the gate, ahead of the two-hour job it
  # guards. Both review rounds found the gate reporting OK for a run that
  # proved nothing; these cases are that class of defect, staged.
  gate-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # The gate shells out to `cargo mutants`, and `cargo` is a rustup shim
      # that resolves rust-toolchain.toml (1.92.0 + rustfmt + clippy) before
      # ever reaching the stubbed cargo-mutants this self-test substitutes —
      # the stub only replaces the subcommand, not the toolchain underneath
      # it. Installing the pinned toolchain once here means that resolution
      # happens up front, not lazily on each of the self-test's ten gate
      # invocations, and a toolchain problem fails as itself instead of
      # surfacing as "cargo-mutants failed with exit 1".
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Self-test the mutation gate's judgement
        run: bash scripts/tests/mutants-gate-selftest.sh

  # A bounded, BLOCKING mutation run over just what a PR actually changed —
  # the thing #58 review round 6 (M22) asked for after the FULL `mutants`
  # job below was found unable to gate a PR at all. `--in-diff` (passed via
  # mutants-gate.sh's IN_DIFF seam) restricts cargo-mutants to mutants in
  # code the diff touches, so this pays only for the PR's own surface, not
  # the whole four-file scope — a diff of ~220 changed lines in env.rs
  # measured 22 in-diff mutants against 396 for the whole file (checked
  # locally against this repo's actual env.rs, #58 review round 6). Still
  # judged against the same committed allowlist as the FULL job: a NEW
  # unwaived survivor or NEW timeout inside the diff fails this job exactly
  # as it would fail `mutants`. What it does NOT do — see mutants-gate.sh's
  # own IN_DIFF handling — is treat a waived line the diff never touched as
  # proven-dead-or-alive; it is simply not re-measured this run, and is
  # reported that way, not folded into a false "went stale" read.
  mutants-pr:
    needs: gate-selftest
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # A diff-bounded run over one PR's surface is a small fraction of the
    # full job's tens of minutes — 30 minutes is headroom for a PR that
    # touches a lot of the scoped files at once, not the expected case.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow single-commit checkout:
          # `git diff --merge-base` below needs the PR's base commit
          # reachable locally to find the merge base, and a shallow clone
          # of just the PR head cannot see it.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0

      - name: Compute the PR's diff over the mutation scope
        # The path list is READ OUT OF mutants-gate.sh's own `default_files`
        # line rather than written here a second time: two hand-maintained
        # copies of one scope drift, and this exact job is the one that would
        # then silently under-diff a PR touching only the newly-scoped file
        # (the same defect the `&mutants_scope_paths` anchor above exists to
        # prevent for `paths:`, one level down — #58 local merge-gate; the
        # widening plan is #71). The grep is anchored to the assignment, and
        # the guard below fails the job loudly if the extraction ever stops
        # matching instead of diffing against nothing.
        run: |
          default_files="$(grep -oP '^default_files="\K[^"]+' scripts/tests/mutants-gate.sh)"
          if [ -z "$default_files" ]; then
            echo "::error::could not extract default_files from scripts/tests/mutants-gate.sh — the scope's single owner moved; fix this extraction with it" >&2
            exit 1
          fi
          echo "mutants-pr: scope (from mutants-gate.sh): $default_files"
          # shellcheck disable=SC2086 -- comma-separated list becomes word-split paths deliberately
          git diff --merge-base "${{ github.event.pull_request.base.sha }}" HEAD \
            -- ${default_files//,/ } \
            > "$RUNNER_TEMP/pr.diff"
          echo "mutants-pr: diff has $(wc -l < "$RUNNER_TEMP/pr.diff") line(s) over the mutation scope"

      - name: Run the mutation gate, bounded to this PR's diff
        # Skipped when the diff is empty: the gate itself would report "OK —
        # the diff touches nothing mutable" after paying for a full baseline
        # build; checking the file first spends nothing to conclude the same.
        run: |
          if [ ! -s "$RUNNER_TEMP/pr.diff" ]; then
            echo "mutants-pr: empty diff over the mutation scope — nothing to audit this run"
            exit 0
          fi
          MUTANTS_OUT="$RUNNER_TEMP/mutants" \
            IN_DIFF="$RUNNER_TEMP/pr.diff" \
            bash scripts/tests/mutants-gate.sh

      - name: Upload diff-bounded mutants report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-pr-report
          path: ${{ runner.temp }}/mutants/mutants.out
          if-no-files-found: ignore

  mutants:
    needs: gate-selftest
    # Not on pull_request: that event fires on every push to an open PR, and
    # a FULL run costs tens of minutes — the merge-path cost this workflow
    # rides schedule/push-to-main to avoid (see the `on:` block above).
    # gate-selftest and mutants-pr above still run on every PR touching the
    # gate files, and mutants-pr's diff-bounded run is what actually gates a
    # PR's own changes — see its comment. This condition is what makes the
    # FULL `mutants` job unable to re-verify the WHOLE scope against a PR
    # automatically — `workflow_dispatch` is the deliberate exception (see
    # its comment in the `on:` block), for a maintainer who wants CI, not
    # just a human, to have re-measured this exact PR head, in full, before
    # merge.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Pinned: mutants-allowlist.txt keys on cargo-mutants' verbatim output
      # (the mutation description text, missed.txt's formatting), so an
      # unpinned `latest` resolving a new release on its own schedule would
      # turn every waived line stale and every survivor new in one stroke,
      # for a reason nothing in this repo names. Bumping the pin is a
      # deliberate change that re-measures the whole allowlist.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0

      # No FILES= here: the scope used to be re-pinned in this job "so it's
      # readable in the job and not only in the script's default" — that
      # readability is exactly what gave the scope two hand-maintained
      # copies, free to drift apart with nothing to notice (F4). The
      # script's default (scripts/tests/mutants-gate.sh) is now the one
      # owner; mutants-gate.sh itself guards against a narrowing that drops
      # a waived file. Widening the audited set is an edit to that default
      # plus a matching allowlist review — not this job.
      - name: Run the mutation gate (merge-seam neighbourhood + infer core)
        run: |
          MUTANTS_OUT="$RUNNER_TEMP/mutants" \
            bash scripts/tests/mutants-gate.sh

      - name: Upload full mutants report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: ${{ runner.temp }}/mutants/mutants.out
          if-no-files-found: ignore
